# CMSIS-DAP probe (e.g. Raspberry Pi Debug Probe) on J22 (JST-SH: SWCLK, GND,
# SWDIO). J22 has no NRST, so this uses a software reset. If firmware has put
# the chip in Stop/Standby or reused the SWD pins, recover with BOOT0 + RESET
# first.
source [find interface/cmsis-dap.cfg]
transport select swd

set WORKAREASIZE 0x8000
set CHIPNAME STM32U585CIUx
set ENABLE_LOW_POWER 1
set STOP_WATCHDOG 1
adapter speed 4000
reset_config none

source [find target/stm32u5x.cfg]
