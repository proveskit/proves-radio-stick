# Default: STLINK-V3MINIE on J5 (STDC14), connect-under-reset via NRST.
# For a CMSIS-DAP probe on J22 (no NRST), use support/openocd-cmsis-dap.cfg:
#   west flash -r openocd --config <board dir>/support/openocd-cmsis-dap.cfg
source [find interface/stlink-dap.cfg]
transport select "dapdirect_swd"

set WORKAREASIZE 0x8000
set CHIPNAME STM32U585CIUx
set BOARDNAME PROVES_RADIO_STICK_V3
set ENABLE_LOW_POWER 1
set STOP_WATCHDOG 1
set CLOCK_FREQ 8000

reset_config srst_only srst_nogate connect_assert_srst
set CONNECT_UNDER_RESET 1
set CORE_RESET 0

source [find target/stm32u5x.cfg]
